# Include inside the existing server block. Keep its root and TLS settings.
# Revalidate entry/metadata/stable data URLs after a version switch.
location = /floodtrace/index.html {
    expires -1;
}
location = /floodtrace/deployment-manifest.json {
    expires -1;
}
location ^~ /floodtrace/data/ {
    expires -1;
}
